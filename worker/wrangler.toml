name = "ccms-api"
main = "src/index.js"
compatibility_date = "2026-11-09"

# Konfigurasi per environment (dev/staging/prod).
# GAS_URL  : URL deploy Google Apps Script (per environment).
# ALLOWED_ORIGINS : JSON array origin frontend yang diizinkan (CORS).
[vars]
GAS_URL = "https://script.google.com/macros/s/AKfycbxl2Eo8Zn8v0JFRVJhoVJ6Cf_rq7tsFU83fyjYWH7Xw7hq9khscbdhpB57nQaNm_YqIMQ/exec"
ALLOWED_ORIGINS = '["https://ccms-public.pages.dev","https://ccms-internal.pages.dev","https://4d40e962.ccms-public.pages.dev","https://d77ae448.ccms-internal.pages.dev"]'

# Untuk environment lain:
#   wrangler deploy --env staging
# dan tambahkan blok di bawah (contoh):
#
# [env.staging.vars]
# GAS_URL = "https://script.google.com/macros/s/DEPLOY_ID_STAGING/exec"
# ALLOWED_ORIGINS = '["https://ccms-staging.pages.dev"]'

# [env.production.vars]
# GAS_URL = "https://script.google.com/macros/s/DEPLOY_ID_PROD/exec"
