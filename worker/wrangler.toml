name = "ccms-api"
main = "src/index.js"
compatibility_date = "2026-11-09"

# Fail closed: deployment harus memilih environment dan mengisi GAS_URL
# spesifik environment. Jangan pernah menaruh URL GAS PROD pada konfigurasi DEV.
[vars]
GAS_URL = "CONFIGURE_GAS_URL_FOR_SELECTED_ENV"
ALLOWED_ORIGINS = '[]'

[env.dev]
name = "ccms-api-dev"

[env.dev.vars]
GAS_URL = "CONFIGURE_DEV_GAS_URL"
ALLOWED_ORIGINS = '["https://ccms-public-dev.pages.dev","https://ccms-internal-dev.pages.dev"]'

[env.staging]
name = "ccms-api-staging"

[env.staging.vars]
GAS_URL = "CONFIGURE_STAGING_GAS_URL"
ALLOWED_ORIGINS = '["https://ccms-public-staging.pages.dev","https://ccms-internal-staging.pages.dev"]'

[env.production]
name = "ccms-api-production"

[env.production.vars]
GAS_URL = "CONFIGURE_PRODUCTION_GAS_URL"
ALLOWED_ORIGINS = '["https://ccms-public.pages.dev","https://ccms-internal.pages.dev"]'
